name: Registry integration checks
on:
  push:
    branches: [feature/gon-management-registry]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and run existing regression checks
        run: python build.py
      - name: Retain compiled public assets and sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gon-registry-build-output
          path: |
            public/
            assets/
            registry_integration.py
            proforma_v3_integration.py
          retention-days: 7
